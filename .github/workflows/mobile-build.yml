name: mobile-build

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch: {}

jobs:
  android:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI workload
        run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

      - name: Restore
        run: dotnet restore mobile/UBee.App.csproj

      - name: Build (Android)
        run: dotnet build mobile/UBee.App.csproj -f net10.0-android -c Release

  ios:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      # Pinned: workload set 10.0.401 has iOS 26.5.10318 (needs Xcode 26.6,
      # which the runner has). Newer set 10.0.401.1 has iOS 27.0 (needs Xcode 27).
      # Remove the --version pin once the runner image ships Xcode 27.
      - name: Install MAUI iOS workload
        run: dotnet workload install maui --version 10.0.401 --source https://api.nuget.org/v3/index.json

      - name: Restore
        run: dotnet restore mobile/UBee.App.csproj

      - name: Build (iOS)
        run: dotnet build mobile/UBee.App.csproj -f net10.0-ios -c Release -p:EnableCodeSigning=false


        - name: Publish APK
        run: dotnet publish mobile/UBee.App.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk -o out

      - uses: actions/upload-artifact@v4
        with:
          name: ubee-apk
          path: out/*.apk




        
