name: mobile-build

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch: {}

jobs:
  android:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI workload
        run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

      - name: Restore
        run: dotnet restore mobile/UBee.App.csproj

      - name: Build (Android)
        run: dotnet build mobile/UBee.App.csproj -f net10.0-android -c Release

  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI workload
        run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

      - name: Restore
        run: dotnet restore mobile/UBee.App.csproj

      - name: Build (iOS)
        run: dotnet build mobile/UBee.App.csproj -f net10.0-ios -c Release -p:EnableCodeSigning=false
